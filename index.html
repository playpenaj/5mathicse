<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Jungle Math Quest — Class 5 Maths Adventure</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐿️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   JUNGLE MATH QUEST — styles
   Palette: leaf #3FA34D, sky #4FB0E8, mango #FF7A5C, sun #FFB238,
            canopy navy #1F3A3D, paper #FFF8EC
   ========================================================================== */

:root {
  --leaf: #3FA34D;
  --sky: #4FB0E8;
  --mango: #FF7A5C;
  --sun: #FFB238;
  --canopy: #1F3A3D;
  --paper: #FFF8EC;
  --paper-2: #FFFFFF;
  --ink: #234034;
  --ink-soft: #5B7268;
  --danger: #E85D5D;
  --radius-lg: 26px;
  --radius-md: 18px;
  --radius-sm: 12px;
  --shadow: 0 10px 24px rgba(31, 58, 61, 0.12);
  --shadow-lg: 0 18px 40px rgba(31, 58, 61, 0.18);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Nunito", "Segoe UI", system-ui, sans-serif;
  min-height: 100%;
}

body {
  background-image:
    radial-gradient(circle at 8% 15%, rgba(63,163,77,0.10) 0, transparent 40%),
    radial-gradient(circle at 92% 85%, rgba(255,178,56,0.12) 0, transparent 45%),
    radial-gradient(circle at 85% 10%, rgba(79,176,232,0.10) 0, transparent 35%);
}

h1, h2, h3, .display {
  font-family: "Baloo 2", "Nunito", system-ui, sans-serif;
  font-weight: 700;
}

#app {
  max-width: 760px;
  margin: 0 auto;
  padding: 18px 18px 60px;
  min-height: 100vh;
  position: relative;
}

/* ---------------- topbar ---------------- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 18px;
}

.brand {
  font-family: "Baloo 2", sans-serif;
  font-weight: 800;
  font-size: 22px;
  color: var(--canopy);
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand.small { font-size: 18px; color: var(--accent, var(--canopy)); }

.stat-pills { display: flex; gap: 8px; align-items: center; }
.pill {
  background: var(--paper-2);
  border-radius: 999px;
  padding: 7px 12px;
  font-weight: 800;
  font-size: 13px;
  box-shadow: var(--shadow);
  color: var(--canopy);
}
.pill.reset {
  cursor: pointer;
  padding: 7px 11px;
  color: var(--ink-soft);
  font-weight: 900;
}
.pill.reset:hover { color: var(--danger); }

.back-btn {
  background: var(--paper-2);
  border: none;
  border-radius: 999px;
  padding: 9px 16px;
  font-weight: 800;
  font-family: inherit;
  font-size: 14px;
  color: var(--canopy);
  box-shadow: var(--shadow);
  cursor: pointer;
}
.back-btn:hover { transform: translateY(-1px); }

/* ---------------- mascot banner ---------------- */
.mascot-banner {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--paper-2);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}
.mascot-emoji {
  font-size: 42px;
  flex-shrink: 0;
  animation: bob 2.6s ease-in-out infinite;
}
@keyframes bob {
  0%, 100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-6px) rotate(3deg); }
}
.speech {
  font-weight: 700;
  font-size: 15px;
  color: var(--canopy);
  line-height: 1.4;
}

/* ---------------- overall progress ---------------- */
.overall-bar-wrap { margin-bottom: 22px; }
.overall-bar-label { font-size: 13px; font-weight: 800; color: var(--ink-soft); margin-bottom: 6px; }
.overall-bar {
  height: 12px;
  background: #E7EFE9;
  border-radius: 999px;
  overflow: hidden;
}
.overall-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--leaf), var(--sky));
  border-radius: 999px;
  transition: width .5s ease;
}

/* ---------------- jungle map ---------------- */
.map {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 26px;
  padding: 10px 0 20px;
}
.map::before {
  content: "";
  position: absolute;
  top: 40px;
  bottom: 40px;
  left: 50%;
  width: 6px;
  transform: translateX(-50%);
  background-image: linear-gradient(var(--sun), var(--sun));
  background-size: 6px 18px;
  background-repeat: repeat-y;
  opacity: .35;
  border-radius: 3px;
}

.map-node {
  display: flex;
  align-items: center;
  gap: 16px;
  cursor: pointer;
  position: relative;
  z-index: 1;
}
.map-node.right { flex-direction: row-reverse; text-align: right; }

.node-ring {
  --pct: 0;
  width: 84px;
  height: 84px;
  border-radius: 50%;
  flex-shrink: 0;
  background:
    radial-gradient(closest-side, var(--paper-2) 68%, transparent 69% 100%),
    conic-gradient(var(--accent) calc(var(--pct) * 1%), #E7EFE9 0);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow);
  transition: transform .2s ease;
}
.map-node:hover .node-ring { transform: scale(1.06); }
.node-emoji { font-size: 34px; }

.node-info { background: var(--paper-2); border-radius: var(--radius-md); padding: 12px 16px; box-shadow: var(--shadow); flex: 1; }
.node-title { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 17px; color: var(--accent); }
.node-tag { font-size: 12.5px; color: var(--ink-soft); font-weight: 700; margin-top: 2px; }
.node-progress { font-size: 12px; font-weight: 800; color: var(--ink-soft); margin-top: 6px; }

.star { color: #DCE3DD; font-size: 13px; }
.star.on { color: var(--sun); }

/* ---------------- unit view ---------------- */
.unit-tagline { color: var(--ink-soft); font-weight: 700; margin: -8px 0 18px; }

.lesson-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}
@media (max-width: 480px) {
  .lesson-grid { grid-template-columns: 1fr; }
}

.lesson-card {
  background: var(--paper-2);
  border-radius: var(--radius-md);
  padding: 18px 16px;
  box-shadow: var(--shadow);
  cursor: pointer;
  border: 3px solid transparent;
  transition: transform .15s ease, border-color .15s ease;
}
.lesson-card:hover { transform: translateY(-3px); border-color: var(--accent); }
.lesson-emoji { font-size: 30px; margin-bottom: 6px; }
.lesson-title { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 16px; color: var(--canopy); margin-bottom: 6px; }
.lesson-stars { margin-bottom: 8px; }
.lesson-cta { font-size: 12.5px; font-weight: 800; color: var(--accent); }

/* ---------------- learn view ---------------- */
.learn-card {
  background: var(--paper-2);
  border-radius: var(--radius-lg);
  padding: 22px;
  box-shadow: var(--shadow);
  border-top: 8px solid var(--accent);
}
.learn-intro { font-weight: 800; font-size: 16px; color: var(--canopy); margin-bottom: 14px; line-height: 1.5; }
.learn-points { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; }
.learn-points li { font-size: 14.5px; line-height: 1.5; color: var(--ink); }
.learn-points b { color: var(--accent); }

.example-box {
  margin-top: 18px;
  background: #FBF6EA;
  border-radius: var(--radius-md);
  padding: 14px 16px;
}
.example-title { font-weight: 800; font-size: 14px; color: var(--canopy); margin-bottom: 8px; }
.example-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.example-table td { padding: 6px 8px; border-bottom: 1px dashed #E3D9BF; color: var(--ink); }
.example-table tr:last-child td { border-bottom: none; }

.cta-btn {
  display: block;
  width: 100%;
  margin-top: 20px;
  background: var(--accent, var(--leaf));
  color: #fff;
  border: none;
  border-radius: 999px;
  padding: 15px;
  font-family: "Baloo 2", sans-serif;
  font-weight: 800;
  font-size: 16px;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform .12s ease;
}
.cta-btn:hover { transform: translateY(-2px); }
.cta-btn:active { transform: translateY(0); }
.cta-btn.small { width: auto; padding: 11px 22px; margin-top: 14px; font-size: 14px; }
.cta-btn.ghost { background: var(--paper-2); color: var(--canopy); border: 2px solid #E1E8E2; box-shadow: none; }

/* ---------------- practice view ---------------- */
.progress-dots { display: flex; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #E1E8E2; }
.dot.done { background: var(--leaf); }
.dot.active { background: var(--accent, var(--sky)); transform: scale(1.3); }

.question-card {
  background: var(--paper-2);
  border-radius: var(--radius-lg);
  padding: 22px;
  box-shadow: var(--shadow);
  border-top: 8px solid var(--accent);
}
.question-card.brain { border-top-color: var(--mango); background: linear-gradient(180deg, #FFF3EE 0%, var(--paper-2) 70px); }
.q-count { font-size: 12.5px; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .04em; }
.q-text { font-family: "Baloo 2", sans-serif; font-weight: 700; font-size: 19px; color: var(--canopy); margin: 10px 0 18px; line-height: 1.45; }

.options { display: flex; flex-direction: column; gap: 10px; }
.option-btn {
  text-align: left;
  background: #F5F1E6;
  border: 2px solid transparent;
  border-radius: var(--radius-sm);
  padding: 13px 16px;
  font-family: "Nunito", sans-serif;
  font-weight: 700;
  font-size: 15px;
  color: var(--ink);
  cursor: pointer;
  transition: all .12s ease;
}
.option-btn:hover:not(:disabled) { border-color: var(--accent); transform: translateX(3px); }
.option-btn:disabled { cursor: default; }
.option-btn.correct { background: #E4F5E7; border-color: var(--leaf); color: #1F6B34; }
.option-btn.wrong { background: #FCE8E6; border-color: var(--danger); color: #A23A32; }

.feedback { margin-top: 6px; }
.fb-box { border-radius: var(--radius-md); padding: 14px 16px; margin-top: 14px; font-size: 14px; line-height: 1.5; }
.fb-correct { background: #E4F5E7; color: #1F6B34; }
.fb-wrong { background: #FFF1E3; color: #7A4A15; }
.fb-head { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 15.5px; margin-bottom: 6px; }
.fb-body b { color: inherit; }

/* ---------------- summary view ---------------- */
.summary-card {
  background: var(--paper-2);
  border-radius: var(--radius-lg);
  padding: 32px 24px;
  box-shadow: var(--shadow-lg);
  text-align: center;
  margin-top: 40px;
  border-top: 10px solid var(--accent);
}
.summary-emoji { font-size: 56px; margin-bottom: 6px; }
.summary-title { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 20px; color: var(--canopy); margin-bottom: 10px; }
.summary-stars { font-size: 26px; margin-bottom: 10px; }
.summary-score { font-weight: 800; color: var(--ink-soft); margin-bottom: 8px; }
.summary-xp { display: inline-block; background: #FFF3D6; color: #8A6300; font-weight: 800; font-size: 13px; padding: 8px 14px; border-radius: 999px; margin-bottom: 10px; }
.summary-actions { display: flex; gap: 10px; margin-top: 18px; }
.summary-actions .cta-btn { margin-top: 0; }

/* ---------------- confetti ---------------- */
#confetti-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 999;
}
.confetti-piece {
  position: absolute;
  top: 30vh;
  width: 9px;
  height: 14px;
  opacity: 0.95;
  animation-name: fall;
  animation-timing-function: ease-in;
  animation-fill-mode: forwards;
}
@keyframes fall {
  0% { transform: translate(0, 0) rotate(0); opacity: 1; }
  100% { transform: translate(calc(var(--dx) * 120px), 62vh) rotate(var(--rot)); opacity: 0; }
}

/* ---------------- nav pill extras ---------------- */
.pill.navbtn { cursor: pointer; }
.pill.navbtn:hover { transform: translateY(-1px); }

/* ---------------- status chips ---------------- */
.chip { display: inline-block; font-size: 10.5px; font-weight: 900; padding: 3px 9px; border-radius: 999px; text-transform: uppercase; letter-spacing: .02em; }
.status-new { background: #EDEDED; color: #8A8A8A; }
.status-progress { background: #FFF3D6; color: #8A6300; }
.status-done { background: #E4F5E7; color: #1F6B34; }
.status-mastered { background: #FFE3D6; color: #B5461F; }

.node-title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chrow-title-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* ---------------- random practice CTA (unit page) ---------------- */
.random-cta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  background: linear-gradient(135deg, #FFF7E8, #FFF1E3);
  border: 2px dashed var(--accent, var(--sun));
  border-radius: var(--radius-lg);
  padding: 16px 18px;
  margin-top: 22px;
  flex-wrap: wrap;
}
.random-cta-text { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--canopy); max-width: 420px; }
.random-cta-text b { font-family: "Baloo 2", sans-serif; font-size: 15.5px; }
.random-cta-stats { font-size: 11.5px; font-weight: 800; color: var(--ink-soft); }
.question-card.random-q { border-top-color: var(--sun); }

/* ---------------- progress dashboard ---------------- */
.progress-summary-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 22px;
}
@media (max-width: 560px) { .progress-summary-grid { grid-template-columns: repeat(2, 1fr); } }
.psum-card {
  background: var(--paper-2);
  border-radius: var(--radius-md);
  padding: 16px 12px;
  text-align: center;
  box-shadow: var(--shadow);
}
.psum-num { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 24px; color: var(--leaf); }
.psum-label { font-size: 11px; font-weight: 800; color: var(--ink-soft); margin-top: 4px; line-height: 1.3; }

.chapter-list { display: flex; flex-direction: column; gap: 10px; }
.chapter-row {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--paper-2);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  box-shadow: var(--shadow);
  cursor: pointer;
  border-left: 6px solid var(--accent);
  transition: transform .12s ease;
}
.chapter-row:hover { transform: translateX(3px); }
.chrow-emoji { font-size: 28px; flex-shrink: 0; }
.chrow-main { flex: 1; min-width: 0; }
.chrow-title { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 15px; color: var(--accent); }
.chrow-bar { height: 8px; background: #E7EFE9; border-radius: 999px; overflow: hidden; margin: 7px 0 6px; }
.chrow-bar-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s ease; }
.chrow-meta { font-size: 11.5px; font-weight: 700; color: var(--ink-soft); }

/* ---------------- guide callout (home) ---------------- */
.guide-callout {
  display: flex;
  align-items: center;
  gap: 14px;
  background: linear-gradient(135deg, #EAF1FF, #F3EEFF);
  border: 2px solid #C9D6FF;
  border-radius: var(--radius-lg);
  padding: 14px 18px;
  margin-bottom: 18px;
  cursor: pointer;
  transition: transform .12s ease;
}
.guide-callout:hover { transform: translateY(-2px); }
.guide-callout-emoji { font-size: 30px; flex-shrink: 0; }
.guide-callout-text { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.guide-callout-text b { font-family: "Baloo 2", sans-serif; font-size: 15px; color: var(--canopy); }
.guide-callout-text span { font-size: 12.5px; color: var(--ink-soft); font-weight: 700; line-height: 1.4; }
.guide-callout-arrow { font-size: 22px; color: var(--sky); font-weight: 900; }

/* ---------------- word problem guide page ---------------- */
.guide-intro {
  display: flex;
  align-items: center;
  gap: 16px;
  background: var(--paper-2);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
}
.guide-intro-emoji { font-size: 40px; flex-shrink: 0; }
.guide-intro b { font-family: "Baloo 2", sans-serif; font-size: 17px; color: var(--canopy); }
.guide-intro p { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-soft); font-weight: 700; }

.guide-steps { display: flex; flex-direction: column; gap: 12px; margin-bottom: 26px; }
.guide-step { display: flex; align-items: flex-start; gap: 14px; background: var(--paper-2); border-radius: var(--radius-md); padding: 14px 16px; box-shadow: var(--shadow); }
.guide-step-num { flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%; background: var(--sky); color: #fff; font-family: "Baloo 2", sans-serif; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.guide-step-text { font-size: 14px; color: var(--ink); line-height: 1.5; }
.guide-step-text b { color: var(--canopy); }

.guide-clue-title { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 16px; color: var(--canopy); margin-bottom: 12px; }
.guide-clue-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 22px; }
@media (max-width: 560px) { .guide-clue-grid { grid-template-columns: 1fr; } }
.guide-clue-card { background: var(--paper-2); border-radius: var(--radius-md); padding: 14px 16px; box-shadow: var(--shadow); border-left: 6px solid var(--accent); }
.guide-clue-op { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 15px; color: var(--accent); margin-bottom: 6px; }
.guide-clue-words { font-size: 13px; color: var(--ink); line-height: 1.5; }

.guide-tip { background: #FFF3D6; color: #8A6300; border-radius: var(--radius-md); padding: 14px 16px; font-size: 13.5px; font-weight: 700; line-height: 1.5; }

/* ---------------- backup box (progress page) ---------------- */
.backup-box {
  margin-top: 26px;
  background: var(--paper-2);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  box-shadow: var(--shadow);
  border-top: 6px solid var(--sun);
}
.backup-title { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 16px; color: var(--canopy); margin-bottom: 6px; }
.backup-text { font-size: 13px; color: var(--ink-soft); font-weight: 700; line-height: 1.5; margin: 0 0 14px; }
.backup-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.backup-msg { margin-top: 10px; font-size: 13px; font-weight: 800; min-height: 18px; }
.backup-msg.ok { color: #1F6B34; }
.backup-msg.err { color: #A23A32; }

/* ---------------- misc ---------------- */
::selection { background: var(--sun); color: #fff; }

button { font-family: inherit; }

@media (prefers-reduced-motion: reduce) {
  .mascot-emoji { animation: none; }
  .confetti-piece { animation: none; display: none; }
}

</style>
</head>

<div id="confetti-layer"></div>
<div id="app"></div>
<script>
const UNITS = [
  {
    "id": "u1",
    "name": "Big Number Explorer",
    "tagline": "Crores, lakhs & giant numbers",
    "emoji": "🔢",
    "color": "#3FA34D",
    "lessons": [
      {
        "id": "u1l1",
        "title": "Place Value Palace",
        "emoji": "🏰",
        "learn": {
          "intro": "Every digit in a number lives in its own 'room' — and the room it's in decides how much it's really worth!",
          "points": [
            "In the Indian system, we group digits as: Ones, Tens, Hundreds, Thousands, Ten Thousands, <b>Lakhs</b>, Ten Lakhs, <b>Crores</b>.",
            "Commas go after the first 3 digits (from the right), then after every 2 digits: <b>7,45,32,891</b>.",
            "1 lakh = 1,00,000 &nbsp;•&nbsp; 1 crore = 1,00,00,000 = 100 lakhs.",
            "🔑 Word-problem clue: if a question mentions a <b>digit's position</b> or says 'value of the digit', it's asking for <b>place value</b>."
          ],
          "example": {
            "title": "Example: 7,45,32,891",
            "rows": [
              [
                "Crore",
                "7",
                "7,00,00,000"
              ],
              [
                "Ten Lakh",
                "4",
                "40,00,000"
              ],
              [
                "Lakh",
                "5",
                "5,00,000"
              ],
              [
                "Ten Th.",
                "3",
                "30,000"
              ],
              [
                "Th.",
                "2",
                "2,000"
              ],
              [
                "Hundred",
                "8",
                "800"
              ],
              [
                "Tens",
                "9",
                "90"
              ],
              [
                "Ones",
                "1",
                "1"
              ]
            ]
          }
        },
        "questions": [
          {
            "q": "The number of books in a district library is 5,79,734. What is the place value of the digit that sits in the thousands place?",
            "type": "mcq",
            "options": [
              "9,000",
              "11,000",
              "90,000",
              "10,000"

<script>
/* ==========================================================================
   JUNGLE MATH QUEST — random question generators
   One generator per unit for infinite "long-term memory" practice.
   Each generator returns { q, options, answer, explain } (MCQ, 4 options).
   ========================================================================== */

function rint(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function fmt(n) { return typeof n === "number" ? n.toLocaleString("en-IN") : n; }
function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
function lcmOf(a, b) { return (a * b) / gcd(a, b); }

// Build 4 shuffled MCQ options (correct + up to 3 unique numeric distractors)
function buildNumericOptions(correct, distractorFn) {
  const set = new Set([correct]);
  let guard = 0;
  while (set.size < 4 && guard < 30) {
    guard++;
    const d = distractorFn();
    if (d !== correct && d >= 0) set.add(d);
  }
  const opts = Array.from(set).slice(0, 4);
  while (opts.length < 4) opts.push(correct + opts.length * 3 + 1);
  for (let i = opts.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [opts[i], opts[j]] = [opts[j], opts[i]];
  }
  return opts.map(fmt);
}

const GENERATORS = {
  // ---- Unit 1: Large Numbers ----
  u1: function () {
    const digits = [rint(1, 9), rint(0, 9), rint(0, 9), rint(0, 9), rint(0, 9), rint(0, 9)];
    const num = Number(digits.join(""));
    const places = [
      { name: "ones", mult: 1 }, { name: "tens", mult: 10 }, { name: "hundreds", mult: 100 },
      { name: "thousands", mult: 1000 }, { name: "ten thousands", mult: 10000 }, { name: "lakhs", mult: 100000 }
    ];
    const idx = rint(0, 5); // from right
    const digit = digits[5 - idx];
    const place = places[idx];
    const correct = digit * place.mult;
    const options = buildNumericOptions(correct, () => pick([correct * 10, Math.floor(correct / 10) || correct + 5, correct + place.mult, correct - place.mult >= 0 ? correct - place.mult : correct + place.mult * 2]));
    return {
      q: `In the number <b>${fmt(num)}</b>, what is the place value of the digit in the ${place.name} place (that digit is ${digit})?`,
      options, answer: fmt(correct),
      explain: `The digit ${digit} is in the <b>${place.name}</b> place, so its value = ${digit} × ${fmt(place.mult)} = <b>${fmt(correct)}</b>.`
    };
  },
  // ---- Unit 2: Operations ----
  u2: function () {
    const type = pick(["add", "sub", "mul", "div"]);
    if (type === "add") {
      const a = rint(1000, 90000), b = rint(1000, 90000);
      const correct = a + b;
      return { q: `A shop sold ${fmt(a)} masks in week 1 and ${fmt(b)} in week 2. How many masks in total?`, options: buildNumericOptions(correct, () => correct + pick([-100, 100, -1000, 1000, 10])), answer: fmt(correct), explain: `${fmt(a)} + ${fmt(b)} = <b>${fmt(correct)}</b>.` };
    }
    if (type === "sub") {
      const a = rint(50000, 99000), b = rint(1000, 49000);
      const correct = a - b;
      return { q: `A stadium had ${fmt(a)} seats. ${fmt(b)} tickets were sold. How many seats are still empty?`, options: buildNumericOptions(correct, () => correct + pick([-100, 100, -1000, 1000, 10])), answer: fmt(correct), explain: `${fmt(a)} − ${fmt(b)} = <b>${fmt(correct)}</b>.` };
    }
    if (type === "mul") {
      const a = rint(12, 99), b = rint(3, 12);
      const correct = a * b;
      return { q: `A box holds ${a} sweets. How many sweets are in ${b} such boxes?`, options: buildNumericOptions(correct, () => correct + pick([-a, a, -b, b, 2])), answer: fmt(correct), explain: `${a} × ${b} = <b>${fmt(correct)}</b>.` };
    }
    // div (ensure exact)
    const b = rint(3, 12);
    const correct = rint(5, 40);
    const a = b * correct;
    return { q: `${fmt(a)} sweets are shared equally among ${b} children. How many sweets does each child get?`, options: buildNumericOptions(correct, () => correct + pick([-2, 2, -1, 1, 3])), answer: fmt(correct), explain: `${fmt(a)} ÷ ${b} = <b>${correct}</b>.` };
  },
  // ---- Unit 3: Factors & Multiples ----
  u3: function () {
    const type = pick(["hcf", "lcm"]);
    const a = rint(4, 30), b = rint(4, 30);
    if (type === "hcf") {
      const correct = gcd(a, b);
      return { q: `What is the HCF of ${a} and ${b}?`, options: buildNumericOptions(correct, () => correct + pick([-1, 1, -2, 2, 3])), answer: fmt(correct), explain: `The biggest number that divides both ${a} and ${b} exactly is <b>${correct}</b>.` };
    }
    const correct = lcmOf(a, b);
    return { q: `What is the LCM of ${a} and ${b}?`, options: buildNumericOptions(correct, () => correct + pick([-a, a, -b, b, 4])), answer: fmt(correct), explain: `The smallest number both ${a} and ${b} divide into exactly is <b>${fmt(correct)}</b>.` };

    const opts = Array.from(new Set([answer, ...distractors])).slice(0, 4);
    while (opts.length < 4) opts.push(`${correctNum}/${d + opts.length}`);
    for (let i = opts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[opts[i], opts[j]] = [opts[j], opts[i]]; }
    return { q: `${n1}/${d} + ${n2}/${d} = ?`, options: opts, answer, explain: `Same denominator, so just add the tops: ${n1}+${n2}=${correctNum} → <b>${answer}</b>.` };
  },
  // ---- Unit 5: Decimals ----
  u5: function () {

    const opts = [correct, (Number(correct) + 1).toFixed(2), (Number(correct) - 1).toFixed(2), (Number(correct) + 0.1).toFixed(2)];
    const optsFmt = Array.from(new Set(opts)).map(o => "₹" + o);
    while (optsFmt.length < 4) optsFmt.push("₹" + (Number(correct) + optsFmt.length).toFixed(2));
    for (let i = optsFmt.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[optsFmt[i], optsFmt[j]] = [optsFmt[j], optsFmt[i]]; }
    return { q, options: optsFmt.slice(0, 4), answer: "₹" + correct, explain: isAdd ? `₹${a} + ₹${b} = <b>₹${correct}</b>.` : `₹${hi} − ₹${lo} = <b>₹${correct}</b>.` };
  },
  // ---- Unit 6: Geometry (angle classification) ----
  u6: function () {
    const angle = rint(1, 179);
    let correct;
    if (angle === 90) correct = "Right";
    else if (angle < 90) correct = "Acute";
    else correct = "Obtuse";
    const options = Array.from(new Set(["Acute", "Right", "Obtuse"]));
    while (options.length < 4) options.push("Reflex");
    for (let i = options.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[options[i], options[j]] = [options[j], options[i]]; }
    return { q: `An angle measures ${angle}°. What type of angle is it?`, options, answer: correct, explain: angle === 90 ? `Exactly 90° is a <b>Right</b> angle.` : angle < 90 ? `Less than 90° is an <b>Acute</b> angle.` : `Between 90° and 180° is an <b>Obtuse</b> angle.` };
  },
  // ---- Unit 7: Area & Volume ----
  u7: function () {
    const isVolume = Math.random() < 0.5;
    if (isVolume) {
      const l = rint(2, 12), b = rint(2, 12), h = rint(2, 12);
      const correct = l * b * h;
      const opts = buildNumericOptions(correct, () => correct + pick([-l, l, -b, b, -h, h])).map(o => o + " cu cm");
      return { q: `A cuboid box has length ${l} cm, breadth ${b} cm, and height ${h} cm. What is its volume?`, options: opts, answer: fmt(correct) + " cu cm", explain: `Volume = l × b × h = ${l} × ${b} × ${h} = <b>${fmt(correct)} cu cm</b>.` };
    }
    const l = rint(3, 40), b = rint(3, 40);
    const correct = l * b;
    const opts = buildNumericOptions(correct, () => correct + pick([-l, l, -b, b, 2])).map(o => o + " sq m");
    return { q: `A rectangular garden is ${l} m long and ${b} m broad. What is its area?`, options: opts, answer: fmt(correct) + " sq m", explain: `Area = length × breadth = ${l} × ${b} = <b>${fmt(correct)} sq m</b>.` };
  },
  // ---- Unit 8: Percentages ----
  u8: function () {
    const pct = pick([5, 10, 20, 25, 50, 75]);
    const base = pick([4, 5, 10, 20, 25, 40, 50, 80, 100]) * rint(1, 4);
    const correct = (pct / 100) * base;
    return { q: `What is ${pct}% of ${base}?`, options: buildNumericOptions(correct, () => correct + pick([-5, 5, -2, 2, base * 0.1])), answer: fmt(correct), explain: `${pct}% of ${base} = ${pct}/100 × ${base} = <b>${fmt(correct)}</b>.` };

  // ---- Unit 9: Money (profit/loss) ----
  u9: function () {

    return {
      q: `A shopkeeper bought an item for ₹${cp} and sold it for ₹${sp}. What is the ${isProfit ? "profit" : "loss"}?`,
      options: buildNumericOptions(correct, () => correct + pick([-5, 5, -10, 10, 3])).map(o => "₹" + o),
      answer: "₹" + fmt(correct),
      explain: isProfit ? `SP (₹${sp}) is more than CP (₹${cp}). Profit = ${sp} − ${cp} = <b>₹${correct}</b>.` : `CP (₹${cp}) is more than SP (₹${sp}). Loss = ${cp} − ${sp} = <b>₹${correct}</b>.`

  u10: function () {

    const opts = [correct, `${totalH - 1} h ${totalMin} min`, `${totalH} h ${totalMin === 0 ? 1 : totalMin - 1} min`, `${totalH + 1} h ${totalMin} min`];
    const uniqueOpts = Array.from(new Set(opts));

    for (let i = uniqueOpts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[uniqueOpts[i], uniqueOpts[j]] = [uniqueOpts[j], uniqueOpts[i]]; }
    return { q: `Add ${h1} h ${m1} min and ${h2} h ${m2} min.`, options: uniqueOpts.slice(0, 4), answer: correct, explain: `Minutes: ${m1}+${m2}=${m1 + m2} → ${carryH ? "1 h " : ""}${totalMin} min. Hours: ${h1}+${h2}${carryH ? "+1" : ""}=${totalH} h. Total = <b>${correct}</b>.` };

<script>
/* ==========================================================================
   JUNGLE MATH QUEST — app logic (v2: progress dashboard + random practice)
   ========================================================================== */

const STORAGE_KEY = "jungleMathQuestProgress_v2";

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { xp: 0, lessons: {}, streak: { last: null, count: 0 }, practice: {} };
}

function saveProgress() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress));
}

function bumpStreak() {
  const t = todayStr();
  const s = state.progress.streak;
  if (s.last === t) return;
  const yest = new Date();
  yest.setDate(yest.getDate() - 1);
  const yStr = `${yest.getFullYear()}-${yest.getMonth() + 1}-${yest.getDate()}`;
  s.count = s.last === yStr ? s.count + 1 : 1;
  s.last = t;
  saveProgress();
}

const state = {
  progress: loadProgress(),
  view: "home",       // home | unit | learn | practice | summary | progress | random
  currentUnit: null,
  currentLesson: null,
  qIndex: 0,
  qResults: [],
  answered: false,
  randomQ: null,
  randomSession: { attempts: 0, correct: 0 },
};

const root = document.getElementById("app");

/* ---------------- helpers ---------------- */
function lessonProgress(lessonId) {
  return state.progress.lessons[lessonId] || { stars: 0, best: 0, attempts: 0 };
}

function practiceStats(unitId) {
  return state.progress.practice[unitId] || { attempts: 0, correct: 0 };
}

function unitStats(unit) {
  let done = 0, mastered = 0, stars = 0;
  unit.lessons.forEach(l => {
    const p = lessonProgress(l.id);
    if (p.stars > 0) done++;
    if (p.stars === 3) mastered++;
    stars += p.stars;
  });
  return { done, mastered, total: unit.lessons.length, stars, maxStars: unit.lessons.length * 3 };
}

function unitStatusLabel(unit) {
  const s = unitStats(unit);
  if (s.done === 0) return { text: "Not started", cls: "status-new" };
  if (s.mastered === s.total) return { text: "Mastered!", cls: "status-mastered" };
  if (s.done === s.total) return { text: "Completed", cls: "status-done" };
  return { text: "In progress", cls: "status-progress" };
}

function overallStats() {
  let totalLessons = 0, doneLessons = 0, masteredLessons = 0, totalStars = 0, maxStars = 0;
  let chaptersMastered = 0, chaptersCompleted = 0;
  UNITS.forEach(u => {
    const s = unitStats(u);
    totalLessons += s.total;
    doneLessons += s.done;
    masteredLessons += s.mastered;
    totalStars += s.stars;
    maxStars += s.maxStars;
    if (s.mastered === s.total) chaptersMastered++;
    else if (s.done === s.total) chaptersCompleted++;
  });
  let practiceAttempts = 0, practiceCorrect = 0;
  Object.values(state.progress.practice || {}).forEach(p => { practiceAttempts += p.attempts; practiceCorrect += p.correct; });
  return { totalLessons, doneLessons, masteredLessons, totalStars, maxStars, chaptersMastered, chaptersCompleted, totalChapters: UNITS.length, practiceAttempts, practiceCorrect };
}

function starsHtml(n, max = 3) {
  let h = "";
  for (let i = 1; i <= max; i++) h += `<span class="star ${i <= n ? "on" : ""}">★</span>`;
  return h;
}

const MASCOT_LINES = [
  "Ready for a maths adventure? 🌿",
  "Every explorer started somewhere — let's go!",
  "You've got this, champion! 💪",
  "Oops-proof tip: mistakes help your brain grow stronger!",
  "Pick a camp on the map to begin!",
  "Even when you get it right, read the 'why' — that's the exam-ready trick!",
];

function pickMascotLine() {
  const stats = overallStats();
  if (stats.doneLessons === 0) return "Hi! I'm Bucky 🐿️ — tap a camp on the map to start your first quest!";
  if (stats.chaptersMastered === stats.totalChapters) return "WOW — you've mastered the WHOLE jungle! You're a true Maths Champion! 🏆";
  return MASCOT_LINES[stats.doneLessons % MASCOT_LINES.length];
}

/* ---------------- rendering ---------------- */
function render() {
  if (state.view === "home") return renderHome();
  if (state.view === "unit") return renderUnit();
  if (state.view === "learn") return renderLearn();
  if (state.view === "practice") return renderPractice();
  if (state.view === "summary") return renderSummary();
  if (state.view === "progress") return renderProgress();
  if (state.view === "random") return renderRandomPractice();
  if (state.view === "guide") return renderGuide();

function onAnswer(btn, q) {
  if (state.answered) return;
  state.answered = true;
  const chosen = btn.textContent;
  const correct = chosen === q.answer;
  state.qResults.push(correct);

  document.querySelectorAll(".option-btn").forEach(b => {
    b.disabled = true;
    if (b.textContent === q.answer) b.classList.add("correct");
    else if (b === btn) b.classList.add("wrong");
  });

  const fb = document.getElementById("feedback");
  if (correct) {
    state.progress.xp += q.q.startsWith("🧠") ? 15 : 10;
    saveProgress();
    fb.innerHTML = `
      <div class="fb-box fb-correct">
        <div class="fb-head">🎉 Correct! Here's the method (always good to check!):</div>
        <div class="fb-body">${q.explain}</div>
      </div>
      <button class="cta-btn small" id="nextBtn">Next →</button>
    `;
    burstConfetti();
  } else {
    fb.innerHTML = `
      <div class="fb-box fb-wrong">
        <div class="fb-head">🌱 Not quite — here's how to solve it:</div>
        <div class="fb-body"><b>Correct answer: ${q.answer}</b><br>${q.explain}</div>
      </div>
      <button class="cta-btn small" id="nextBtn">Got it, Next →</button>
    `;
  }
  document.getElementById("nextBtn").addEventListener("click", nextQuestion);
}

function nextQuestion() {
  const l = state.currentLesson;
  if (state.qIndex < l.questions.length - 1) {
    state.qIndex++;
    render();
  } else {
    finishLesson();
  }
}

function finishLesson() {
  const l = state.currentLesson;
  const correctCount = state.qResults.filter(Boolean).length;
  const pct = Math.round((correctCount / l.questions.length) * 100);
  let stars = 0;
  if (pct === 100) stars = 3;
  else if (pct >= 80) stars = 2;
  else if (pct >= 50) stars = 1;

  const prev = lessonProgress(l.id);
  const newStars = Math.max(prev.stars, stars);
  const isFirstClear = prev.stars === 0 && stars > 0;
  state.progress.lessons[l.id] = {
    stars: newStars,
    best: Math.max(prev.best || 0, pct),
    attempts: (prev.attempts || 0) + 1,
  };
  if (isFirstClear) state.progress.xp += 25;
  bumpStreak();
  saveProgress();

  state.lastResult = { correctCount, total: l.questions.length, pct, stars, isFirstClear };
  state.view = "summary";
  render();
  if (stars >= 2) burstConfetti(true);
}

function exportProgress() {
  const dataStr = JSON.stringify(state.progress, null, 2);
  const blob = new Blob([dataStr], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `jungle-math-quest-progress-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  const msg = document.getElementById("backupMsg");
  if (msg) { msg.textContent = "✅ Saved! Check your Downloads folder."; msg.className = "backup-msg ok"; }
}

function importProgressFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const msg = document.getElementById("backupMsg");
    try {
      const parsed = JSON.parse(e.target.result);
      if (typeof parsed !== "object" || parsed === null || !("lessons" in parsed)) {
        throw new Error("bad shape");
      }
      state.progress = {
        xp: typeof parsed.xp === "number" ? parsed.xp : 0,
        lessons: parsed.lessons || {},
        streak: parsed.streak && typeof parsed.streak === "object" ? parsed.streak : { last: null, count: 0 },
        practice: parsed.practice || {},
      };
      saveProgress();
      render();
      setTimeout(() => {
        const m = document.getElementById("backupMsg");
        if (m) { m.textContent = "✅ Progress loaded! Welcome back, explorer! 🌴"; m.className = "backup-msg ok"; }
      }, 50);
    } catch (err) {
      if (msg) { msg.textContent = "⚠️ That file doesn't look like a Jungle Math Quest progress file. Please choose the correct .json file."; msg.className = "backup-msg err"; }
    }
  };
  reader.readAsText(file);
}

/* ---------------- confetti (lightweight, no deps) ---------------- */
function burstConfetti(big) {
  const colors = ["#3FA34D", "#4FB0E8", "#FF7A5C", "#FFB238", "#FFE66D", "#7A5CFF"];
  const count = big ? 60 : 24;
  const layer = document.getElementById("confetti-layer");
  for (let i = 0; i < count; i++) {
    const el = document.createElement("div");
    el.className = "confetti-piece";
    el.style.left = (45 + Math.random() * 10) + "vw";
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.setProperty("--dx", (Math.random() * 2 - 1).toFixed(2));
    el.style.setProperty("--rot", (Math.random() * 360).toFixed(0) + "deg");
    el.style.animationDuration = (0.9 + Math.random() * 0.8) + "s";
    el.style.animationDelay = (Math.random() * 0.15) + "s";
    layer.appendChild(el);
    setTimeout(() => el.remove(), 2000);
  }
}

/* ---------------- boot ---------------- */
if (typeof window !== "undefined") window.state = state;
render();

</script>
</body>
</html>
